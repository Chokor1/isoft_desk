<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240">
<title>ISOFT ERP is loading</title>
<defs>
<radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(74,168,224,.26)"/><stop offset="1" stop-color="rgba(74,168,224,.26)" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.base{fill:none;stroke:rgba(120,160,200,.30);stroke-width:1.4;stroke-dasharray:3 6}
.pulse{fill:none;stroke:#6cc0f0;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:9 120;stroke-dashoffset:110;opacity:0;filter:url(#soft);animation:send 1.6s cubic-bezier(.45,0,.2,1) infinite}
.chip{fill:#101a26;stroke:rgba(140,180,215,.38);stroke-width:1.2}
.chip-on{fill:#6cc0f0;opacity:.25;animation:blink 1.6s ease-out infinite}
.glow{fill:url(#g);transform-origin:260px 120px;animation:breathe 1.6s ease-in-out infinite}
.ring{fill:none;stroke:rgba(120,180,220,.40);stroke-width:1.3;stroke-dasharray:5 7;transform-origin:260px 120px;animation:spin 9s linear infinite}
.ring2{fill:none;stroke:rgba(120,180,220,.16);stroke-width:1}
.disc{fill:#0c1520;stroke:rgba(120,180,220,.30);stroke-width:1}
.mark{transform-origin:260px 120px;animation:beat 1.6s ease-in-out infinite}
@keyframes send{0%{stroke-dashoffset:110;opacity:0}10%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes blink{0%{opacity:1}40%{opacity:.25}100%{opacity:.25}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.92)}55%{opacity:1;transform:scale(1.06)}}
@keyframes beat{0%,100%{transform:scale(1)}55%{transform:scale(1.045)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.pulse,.chip-on,.glow,.ring,.mark{animation:none}.pulse{opacity:0}}
</style>
<path class="base" d="M44 60 H120 V120 H206"/><path class="base" d="M44 120 H206"/><path class="base" d="M44 180 H120 V120 H206"/><path class="base" d="M476 60 H400 V120 H314"/><path class="base" d="M476 120 H314"/><path class="base" d="M476 180 H400 V120 H314"/><path class="pulse" pathLength="100" style="animation-delay:0s" d="M44 60 H120 V120 H206"/><path class="pulse" pathLength="100" style="animation-delay:0.45s" d="M44 120 H206"/><path class="pulse" pathLength="100" style="animation-delay:0.9s" d="M44 180 H120 V120 H206"/><path class="pulse" pathLength="100" style="animation-delay:0.2s" d="M476 60 H400 V120 H314"/><path class="pulse" pathLength="100" style="animation-delay:0.65s" d="M476 120 H314"/><path class="pulse" pathLength="100" style="animation-delay:1.1s" d="M476 180 H400 V120 H314"/><rect class="chip" x="21" y="51" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:0s" x="26" y="56" width="8" height="8" rx="2.5"/><rect class="chip" x="21" y="111" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:0.45s" x="26" y="116" width="8" height="8" rx="2.5"/><rect class="chip" x="21" y="171" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:0.9s" x="26" y="176" width="8" height="8" rx="2.5"/><rect class="chip" x="481" y="51" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:0.2s" x="486" y="56" width="8" height="8" rx="2.5"/><rect class="chip" x="481" y="111" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:0.65s" x="486" y="116" width="8" height="8" rx="2.5"/><rect class="chip" x="481" y="171" width="18" height="18" rx="5"/><rect class="chip-on" style="animation-delay:1.1s" x="486" y="176" width="8" height="8" rx="2.5"/>
<circle class="glow" cx="260" cy="120" r="92"/>
<circle class="ring2" cx="260" cy="120" r="64"/>
<circle class="ring" cx="260" cy="120" r="54"/>
<circle class="disc" cx="260" cy="120" r="42"/>
<image class="mark" href="data:image/png;base64," x="239.3" y="97.0" width="41.5" height="46.0"/>
</svg>